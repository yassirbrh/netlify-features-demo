<!--
  Ce formulaire caché permet à Netlify Forms de détecter le formulaire
  au moment du build, même si notre formulaire principal est dans React.
-->
<form name="contact-demo" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="text" name="name" />
  <input type="email" name="email" />
  <textarea name="message"></textarea>
</form>
